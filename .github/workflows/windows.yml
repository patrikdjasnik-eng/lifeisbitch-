name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'web/**', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check desktop/main.cjs
          node --check web/game.js
          node --check web/renderer3d.js
      - name: Test game launch
        run: npm run desktop:smoke
      - name: Build installer
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and test packaged game and desktop shortcut
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows-dist/*Setup*.exe | Select-Object -First 1
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\LifeIsBitchBeta'
          $desktop = [Environment]::GetFolderPath('Desktop')
          New-Item -ItemType Directory -Force -Path $desktop | Out-Null
          $installer = Start-Process $setup.FullName -ArgumentList '/S', "/D=$installDir" -PassThru
          if (-not $installer.WaitForExit(120000)) { $installer.Kill(); throw 'Installer timeout' }
          if ($installer.ExitCode -ne 0) { throw "Installer exit: $($installer.ExitCode)" }
          $exe = Join-Path $installDir 'Life Is Bitch.exe'
          if (-not (Test-Path $exe)) { throw 'Installed EXE missing' }
          $shortcutPath = Join-Path $desktop 'Life Is Bitch.lnk'
          if (-not (Test-Path $shortcutPath)) { throw 'Desktop shortcut missing' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $exe) { throw "Shortcut target: $($shortcut.TargetPath)" }
          $game = Start-Process $exe -ArgumentList '--smoke' -PassThru
          if (-not $game.WaitForExit(45000)) { $game.Kill(); throw 'Installed game timeout' }
          Get-Content "$env:APPDATA\life-is-bitch\startup.log" -ErrorAction SilentlyContinue
          if ($game.ExitCode -ne 0) { throw "Installed game exit: $($game.ExitCode)" }
          Write-Output 'PASS: silent install, desktop shortcut target, installed game launch'
      - uses: actions/upload-artifact@v4
        with:
          name: life-is-bitch-windows
          path: windows-dist/*.exe
          if-no-files-found: error
