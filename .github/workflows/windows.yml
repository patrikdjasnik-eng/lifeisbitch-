name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'web/**', 'tests/**', 'backend/**', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax and gameplay
        run: |
          node --check desktop/main.cjs
          node --check web/renderer3d.js
          npm test
          python backend/test_accounts.py
      - name: Test game launch
        run: npm run desktop:smoke
      - name: Build Windows game folder
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stage Windows package and verify installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/game | Out-Null
          Copy-Item windows-dist/win-unpacked/* package/game -Recurse -Force
          Copy-Item desktop/Install.ps1, desktop/Install.cmd package/
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\LifeIsBitchBeta'
          & package/Install.ps1 -InstallDir $installDir -NoLaunch
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Install script failed' }
          $exe = Join-Path $installDir 'Life Is Bitch.exe'
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Life Is Bitch.lnk'
          if (-not (Test-Path $exe) -or -not (Test-Path $shortcutPath)) { throw 'EXE or desktop shortcut missing' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $exe) { throw 'Shortcut target mismatch' }
          $game = Start-Process $exe -ArgumentList '--smoke' -PassThru
          if (-not $game.WaitForExit(45000)) { $game.Kill(); throw 'Installed game timeout' }
          if ($game.ExitCode -ne 0) { throw "Installed game exit: $($game.ExitCode)" }
          Write-Output 'PASS: installed game, desktop shortcut, purchases and MHD'
          Compress-Archive -Path package/* -DestinationPath Life-Is-Bitch-Windows-0.1.5.zip
      - uses: actions/upload-artifact@v4
        with:
          name: life-is-bitch-windows
          path: Life-Is-Bitch-Windows-0.1.5.zip
          if-no-files-found: error

      - name: Build one-click EXE installer
        run: npm run desktop:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify EXE installer and shortcut
        shell: pwsh
        run: |
          $setup = Get-Item windows-dist/Life-Is-Bitch-Setup-0.1.5.exe
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/life-is-bitch'
          $process = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Installer timeout' }
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Life Is Bitch.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          $exe = $shortcut.TargetPath
          if (-not $exe -or -not (Test-Path $exe) -or (Split-Path $exe -Leaf) -ne 'Life Is Bitch.exe') { throw 'Installer shortcut target missing or invalid' }
          $game = Start-Process $exe -ArgumentList '--smoke' -PassThru
          if (-not $game.WaitForExit(45000)) { $game.Kill(); throw 'Installed game timeout' }
          if ($game.ExitCode -ne 0) { throw 'Installed game failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: life-is-bitch-setup
          path: windows-dist/Life-Is-Bitch-Setup-0.1.5.exe
          if-no-files-found: error
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.5 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.5 --target "${{ github.sha }}" --title "Life Is Bitch Beta 0.1.5" --notes "Windows x64: email-free accounts, password login, recovery codes, studio branding and one-click installer. Online accounts require a running registry server. Multiplayer and cloud saves are not included."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v0.1.5 windows-dist/Life-Is-Bitch-Setup-0.1.5.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
