name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'web/**', 'tests/**', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax and gameplay
        run: |
          node --check desktop/main.cjs
          node --check web/renderer3d.js
          npm test
      - name: Test game launch
        run: npm run desktop:smoke
      - name: Build Windows game folder
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stage Windows package and verify installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/game | Out-Null
          Copy-Item windows-dist/win-unpacked/* package/game -Recurse -Force
          Copy-Item desktop/Install.ps1, desktop/Install.cmd package/
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\LifeIsBitchBeta'
          & package/Install.ps1 -InstallDir $installDir -NoLaunch
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Install script failed' }
          $exe = Join-Path $installDir 'Life Is Bitch.exe'
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Life Is Bitch.lnk'
          if (-not (Test-Path $exe) -or -not (Test-Path $shortcutPath)) { throw 'EXE or desktop shortcut missing' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $exe) { throw 'Shortcut target mismatch' }
          $game = Start-Process $exe -ArgumentList '--smoke' -PassThru
          if (-not $game.WaitForExit(45000)) { $game.Kill(); throw 'Installed game timeout' }
          if ($game.ExitCode -ne 0) { throw "Installed game exit: $($game.ExitCode)" }
          Write-Output 'PASS: installed game, desktop shortcut, purchases and MHD'
          Compress-Archive -Path package/* -DestinationPath Life-Is-Bitch-Windows-0.1.3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: life-is-bitch-windows
          path: Life-Is-Bitch-Windows-0.1.3.zip
          if-no-files-found: error
