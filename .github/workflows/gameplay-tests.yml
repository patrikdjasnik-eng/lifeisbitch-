name: Gameplay tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/gameplay-tests.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/gameplay-tests.yml'
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check web/game.js
          node --check web/life-system.js
          node --check web/city-map.js
      - name: Run gameplay regression tests
        run: npm test
